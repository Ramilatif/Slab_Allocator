[package]
name = "Slab_Allocator"
version = "0.1.0"
edition = "2021"

# Library target: compiled with the host toolchain for `cargo test`.
# Contains the slab allocator logic and the native unit tests.
[lib]
name = "slab_allocator"
path = "src/lib.rs"
test = true
doctest = false

# Binary target: the bare-metal kernel, built via `cargo kbuild` / `cargo krun`.
[[bin]]
name = "Slab_Allocator"
test = false
bench = false

[dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory"] }
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.14.2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
